# Server Configuration
server.port=8080

# Database Connection (MySQL)
# Note: createDatabaseIfNotExist=true will automatically create the schema 'agri_labour_db' if it does not exist.
spring.datasource.url=jdbc:mysql://localhost:3306/agri_labour_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

# Hibernate / JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
